<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>index</title>
<style>
  :root{
    --bg:#ffffff;
    --txt:#1a1a1a;
    --dim:#9a9a9a;
    --line:#e4e4e4;
    --line-hi:#c9c9c9;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans HK","Helvetica Neue",sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:60px 24px;
  }
  .wrap{width:100%;max-width:420px;}
  h1{
    margin:0 0 28px;
    padding-left:2px;
    font-size:14px;
    font-weight:500;
    letter-spacing:.22em;
    text-transform:lowercase;
    color:var(--dim);
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
    cursor:default;
  }
  a.item{
    display:block;
    text-decoration:none;
    color:inherit;
    border:1px solid var(--line);
    border-radius:12px;
    padding:22px 24px;
    margin-bottom:12px;
    font-size:19px;
    font-weight:500;
    letter-spacing:.03em;
    transition:border-color .18s ease, background .18s ease, transform .18s ease;
  }
  a.item:active{transform:scale(.985);}
  a.item:focus-visible{outline:2px solid var(--txt);outline-offset:3px;}
  @media (hover:hover){
    a.item:hover{border-color:var(--line-hi);background:#fafafa;}
  }
  .hidden-group{display:none;}
  .hidden-group.on{display:block;animation:fade .35s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important;}
  }
</style>
</head>
<body>
<div class="wrap">

  <h1 id="title">index</h1>

  <a class="item" href="./meet-up/">夾日子</a>

  <a class="item" href="./boardgame/">派對遊戲</a>

  <a class="item" href="./pdf-editor/#home">PDF 編輯工具</a>

  <div class="hidden-group" id="secret">
    <a class="item" href="./song-parts/">歌曲分部</a>
  </div>

</div>

<script>
(function(){
  var box = document.getElementById('secret');
  var title = document.getElementById('title');
  var HOLD = 800; // 長按毫秒數
  var timer = null;

  function reveal(){ box.classList.add('on'); }

  // 網址帶 #all 或 ?all 一樣可以打開
  function checkUrl(){
    if (location.hash === '#all' || new URLSearchParams(location.search).has('all')) reveal();
  }
  checkUrl();
  window.addEventListener('hashchange', checkUrl);

  function start(){
    clearTimeout(timer);
    timer = setTimeout(reveal, HOLD);
  }
  function cancel(){
    clearTimeout(timer);
  }

  title.addEventListener('touchstart', start, {passive:true});
  title.addEventListener('touchend', cancel);
  title.addEventListener('touchcancel', cancel);
  title.addEventListener('touchmove', cancel, {passive:true});

  title.addEventListener('mousedown', start);
  title.addEventListener('mouseup', cancel);
  title.addEventListener('mouseleave', cancel);

  // 避免 iOS 長按彈出選字／複製選單
  title.addEventListener('contextmenu', function(e){ e.preventDefault(); });
})();
</script>
</body>
</html>
