<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>0018him</title>
<style>
  :root{
    --bg:#ffffff;
    --txt:#1a1a1a;
    --line:#e4e4e4;
    --line-hi:#c9c9c9;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans HK","Helvetica Neue",sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:60px 24px;
  }
  .wrap{width:100%;max-width:420px;}
  a.item{
    display:block;
    text-decoration:none;
    color:inherit;
    border:1px solid var(--line);
    border-radius:12px;
    padding:22px 24px;
    margin-bottom:12px;
    font-size:19px;
    font-weight:500;
    letter-spacing:.03em;
    transition:border-color .18s ease, background .18s ease, transform .18s ease;
  }
  a.item:active{transform:scale(.985);}
  a.item:focus-visible{outline:2px solid #1a1a1a;outline-offset:3px;}
  @media (hover:hover){
    a.item:hover{border-color:var(--line-hi);background:#fafafa;}
  }
  .hidden-group{display:none;}
  .hidden-group.on{display:block;animation:fade .35s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important;}
  }
  #knob{
    display:block;
    width:44px;
    height:32px;
    margin:28px auto 0;
    cursor:default;
    user-select:none;
  }
  #knob::after{
    content:"";
    display:block;
    width:4px;
    height:4px;
    border-radius:50%;
    background:#e0e0e0;
    margin:14px auto 0;
  }
</style>
</head>
<body>
<div class="wrap">

  <a class="item" href="./meet-up/">夾日子</a>

  <a class="item" href="./boardgame/">派對遊戲</a>

  <div class="hidden-group" id="secret">
    <a class="item" href="./song-parts/">歌曲分部</a>
  </div>

  <div id="knob"></div>
</div>

<script>
(function(){
  var box = document.getElementById('secret');
  var knob = document.getElementById('knob');

  function reveal(){ box.classList.add('on'); }

  function checkUrl(){
    if (location.hash === '#all' || new URLSearchParams(location.search).has('all')) reveal();
  }
  checkUrl();
  window.addEventListener('hashchange', checkUrl);

  var count = 0, timer = null;
  knob.addEventListener('click', function(){
    count++;
    clearTimeout(timer);
    timer = setTimeout(function(){ count = 0; }, 3000);
    if (count >= 5){ count = 0; reveal(); }
  });
})();
</script>
</body>
</html>
